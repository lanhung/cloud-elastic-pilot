global:
  clusterID: ""
  activeRunID: ""
  hookeNamespace: hooke-system
  authTokenSecret:
    name: ""
    key: token

image:
  repository: registry.example.com/hooke
  tag: latest
  # When set, digest takes precedence over tag and renders repository@digest.
  digest: ""
  pullPolicy: IfNotPresent

mysql:
  dsnSecret:
    name: hooke-mysql
    key: dsn

serviceAccount:
  create: true
  name: ""

migration:
  enabled: true

ingester:
  enabled: true
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
controller:
  enabled: true
  replicas: 1
  captureUnlabeled: false
  eventSamplePercent: 100
  eventQueueSize: 8192
  eventBatchSize: 100
  eventFlushInterval: 500ms
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
nodeAgent:
  enabled: true
  healthInterval: 30s
  # Populate only from a real chrony/NTP measurement for the experiment window.
  # Empty means unknown; the agent never invents a zero offset.
  clockOffsetNS: ""
  clockUncertaintyNS: ""
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
ackAdapter:
  enabled: false
  config: {}
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
correlator:
  enabled: false
  runID: ""
  schedule: "*/5 * * * *"

service:
  type: ClusterIP
  port: 8080

podMonitor:
  enabled: false
  interval: 30s

networkPolicy:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}
